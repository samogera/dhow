name: Screenshots
# Runs the full system against a local Supabase with demo data and screenshots every main screen.
on:
  push:
    branches: [main]
    paths: [".github/screenshots-run", "scripts/screenshots/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: screenshots, cancel-in-progress: true }
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase (applies migration and seed)
        run: |
          mkdir -p /tmp/out
          supabase init --force > /dev/null 2>&1 || true
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor,mailpit > /tmp/out/supabase.txt 2>&1 || (cat /tmp/out/supabase.txt; exit 1)
          supabase status -o env > /tmp/supa.env
          cat /tmp/out/supabase.txt | tail -20
      - name: Create demo users and data
        run: |
          set -a; . /tmp/supa.env; set +a
          for e in admin@dhow.test owner@acacia.test; do
            curl -s -X POST "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"$e\",\"password\":\"Demo-password-2026!\",\"email_confirm\":true}" | head -c 200; echo
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/screenshots/demo-data.sql > /tmp/out/demo-data.txt 2>&1 || (cat /tmp/out/demo-data.txt; exit 1)
      - name: Build and start the app
        run: |
          set -a; . /tmp/supa.env; set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_APP_URL=http://localhost:3000 DATA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= KYB_PROVIDER=manual NEXT_TELEMETRY_DISABLED=1
          npm install --no-audit --no-fund > /tmp/out/install.txt 2>&1
          npx next build > /tmp/out/build.txt 2>&1 || (tail -50 /tmp/out/build.txt; exit 1)
          nohup npx next start -p 3000 > /tmp/out/server.txt 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - name: Take screenshots
        run: |
          npm install --no-save playwright@1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node scripts/screenshots/shoot.mjs 2>&1 | tee /tmp/out/shoot.txt
      - name: Publish to the screenshots branch
        if: always()
        run: |
          trap 'echo "::error::publish failed at line $LINENO: $BASH_COMMAND"' ERR
          set -e
          mkdir -p /tmp/pub/shots
          cp shots/*.png /tmp/pub/shots/ 2>/dev/null || echo "::error::no screenshots were taken"
          cp /tmp/out/shoot.txt /tmp/pub/ 2>/dev/null || true
          echo "commit=$GITHUB_SHA" > /tmp/pub/summary.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan screenshots
          git rm -rqf --cached . > /dev/null
          mkdir -p /tmp/publish && cp -r /tmp/pub/. /tmp/publish/
          git --work-tree=/tmp/publish add -A
          git --work-tree=/tmp/publish commit -qm "Screenshots for $GITHUB_SHA"
          git push -f origin screenshots
